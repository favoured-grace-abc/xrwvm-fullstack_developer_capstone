<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Review | {{ dealer.full_name }}</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css" />
    <style>
      body {
        background: #f4f7f8;
        color: #23343b;
      }
      .navbar {
        background: #087e83;
      }
      .navbar h2,
      .navbar a {
        color: #fff;
      }
      .review-form {
        max-width: 760px;
        margin: 38px auto;
        padding: 30px 34px;
        background: #fff;
        border: 1px solid #dce5e7;
        border-radius: 8px;
      }
      .review-form h1 {
        margin: 0 0 6px;
        font-size: 28px;
      }
      .review-form .dealer-location {
        margin-bottom: 26px;
        color: #53676d;
      }
      .review-form label {
        display: block;
        margin: 16px 0 6px;
        font-weight: 600;
      }
      .review-form textarea,
      .review-form input,
      .review-form select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #aebfc3;
        border-radius: 4px;
        font: inherit;
      }
      .review-form textarea {
        min-height: 128px;
        resize: vertical;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .submit-button {
        margin-top: 24px;
        padding: 10px 18px;
        border: 0;
        border-radius: 4px;
        background: #087e83;
        color: white;
        font-weight: 600;
      }
      @media (max-width: 600px) {
        .review-form {
          margin: 20px 12px;
          padding: 22px 18px;
        }
        .form-row {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <h2 class="mb-0">Dealerships</h2>
        <a class="nav-link" href="/">Home</a>
      </div>
    </nav>
    <main class="review-form">
      <h1>{{ dealer.full_name }}</h1>
      <p class="dealer-location">
        {{ dealer.city }}, {{ dealer.state }} · Dealer ID {{ dealer.id }}
      </p>
      <form method="post">
        {% csrf_token %}
        <label for="review">Your review</label>
        <textarea id="review" name="review" required>
The team was helpful, transparent, and made the purchase process straightforward. I am very happy with my vehicle.</textarea
        >
        <div class="form-row">
          <div>
            <label for="purchase-date">Purchase date</label>
            <input
              id="purchase-date"
              name="purchase_date"
              type="date"
              value="2026-09-18"
              required
            />
          </div>
          <div>
            <label for="car">Car make and model</label>
            <select id="car" name="car" required>
              <option value="Toyota Camry" selected>Toyota Camry</option>
              <option value="Honda Civic">Honda Civic</option>
              <option value="Ford Escape">Ford Escape</option>
            </select>
          </div>
        </div>
        <label for="year">Car year</label>
        <input
          id="year"
          name="car_year"
          type="number"
          min="1900"
          max="2026"
          value="2022"
          required
        />
        <button class="submit-button" type="submit">Post Review</button>
      </form>
    </main>
  </body>
</html>
