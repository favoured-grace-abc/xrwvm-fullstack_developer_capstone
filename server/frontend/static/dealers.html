<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dealerships | Best Cars</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/bootstrap.min.css" />
  </head>
  <body class="dealers-page">
    <nav
      class="navbar navbar-expand-lg navbar-light"
      style="background-color: darkturquoise; height: 1in"
    >
      <div class="container-fluid">
        <h2 style="padding-right: 5%">Dealerships</h2>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger" href="/about/"
              >About Us</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger" href="/contact/"
              >Contact Us</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <section class="container mt-4 mb-5">
      <h2 class="mb-3">All Dealerships</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Dealer</th>
              <th scope="col">City</th>
              <th scope="col">Address</th>
              <th scope="col">ZIP</th>
              <th scope="col">State</th>
              <th scope="col">Details</th>
            </tr>
          </thead>
          <tbody>
            {% for dealer in dealerships %}
            <tr>
              <td>{{ dealer.id }}</td>
              <td>{{ dealer.full_name }}</td>
              <td>{{ dealer.city }}</td>
              <td>{{ dealer.address }}</td>
              <td>{{ dealer.zip }}</td>
              <td>{{ dealer.state }}</td>
              <td>
                <a class="btn btn-sm btn-outline-primary"
                  href="/dealers/{{ dealer.id }}"
                  >View Details</a
                >
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>
  </body>
</html>
